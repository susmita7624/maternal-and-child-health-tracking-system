{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">
    <h2 class="mb-4">
        <i class="fas fa-bell text-info"></i> 
        Send SMS Notification
    </h2>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Select Mother</label>
                        <select name="mother" 
                                class="form-control">
                            {% for mother in mothers %}
                            <option value="{{ mother.id }}">
                                {{ mother.name }} - 
                                {{ mother.phone }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label>Message</label>
                        <textarea name="message" 
                                  class="form-control" 
                                  rows="4" required>
                        </textarea>
                    </div>
                </div>
                <button type="submit" 
                        class="btn btn-info">
                    <i class="fas fa-paper-plane"></i> 
                    Send SMS
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
