{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">
    <h2 class="mb-4">
        <i class="fas fa-ambulance text-warning"></i> 
        Report Emergency
    </h2>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Mother</label>
                        <select name="mother" 
                                class="form-control">
                            {% for mother in mothers %}
                            <option value="{{ mother.id }}">
                                {{ mother.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label>Description</label>
                        <textarea name="description" 
                                  class="form-control" 
                                  rows="4" required>
                        </textarea>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label>Action Taken</label>
                        <textarea name="action_taken" 
                                  class="form-control" 
                                  rows="3">
                        </textarea>
                    </div>
                </div>
                <button type="submit" 
                        class="btn btn-warning">
                    <i class="fas fa-save"></i> Submit
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
