{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">
    <h2 class="mb-4">
        <i class="fas fa-baby text-primary"></i> 
        Register Child
    </h2>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Mother</label>
                        <select name="mother" 
                                class="form-control">
                            {% for mother in mothers %}
                            <option value="{{ mother.id }}">
                                {{ mother.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Child Name</label>
                        <input type="text" name="child_name" 
                               class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Gender</label>
                        <select name="gender" 
                                class="form-control">
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Birth Weight (kg)</label>
                        <input type="number" 
                               name="birth_weight" 
                               step="0.01"
                               class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Date of Birth</label>
                        <input type="date" 
                               name="date_of_birth" 
                               class="form-control" required>
                    </div>
                </div>
                <button type="submit" 
                        class="btn btn-primary">
                    <i class="fas fa-save"></i> Register
                </button>
                <a href="/children/" 
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
